<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="siteHeader(activeTab)">
    <a class="brand" th:href="@{/}" aria-label="CertiTrust home">
        <span class="brand-mark" aria-hidden="true">CT</span>
        <span class="brand-name">CertiTrust<span class="brand-caption">CREDENTIAL RECORDS</span></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
        <a th:href="@{/}" th:classappend="${activeTab == 'home'} ? ' is-active' : ''">Home</a>
        <a th:href="@{/verify}" th:classappend="${activeTab == 'verify'} ? ' is-active' : ''">Verify certificate</a>
    </nav>
</header>

<footer class="site-footer" th:fragment="siteFooter">
    <div class="footer-inner">
        <span class="footer-mark" aria-hidden="true">CT</span>
        <div class="footer-project">
            <strong>CertiTrust — Certificate Verification System</strong>
            <p>ESDL Mini Project • Academic Year 2026–27</p>
        </div>
    </div>
</footer>
</body>
</html>
